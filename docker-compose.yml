networks:
  db_net:
    internal: true    # MySQL khong co duong ra Internet
  web_net:
  monitor_net:

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  db:
    image: mysql:8.0
    container_name: sv-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  app:
    build: ./app
    image: sinhvien-app:1.0
    container_name: sv-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    networks:
      - db_net
      - web_net

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: sv-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: https://localhost:8443/phpmyadmin/
    networks:
      - db_net
      - web_net

  nginx:
    image: nginx:1.27-alpine
    container_name: sv-nginx
    restart: unless-stopped
    depends_on:
      - app
      - phpmyadmin
      - grafana
    ports:
      - "8090:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - web_net

  # ======================= GIAM SAT =======================
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: sv-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9099:9090"
    networks:
      - monitor_net
      - web_net

  grafana:
    image: grafana/grafana:11.5.2
    container_name: sv-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: https://localhost:8443/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitor_net
      - web_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sv-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitor_net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sv-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    networks:
      - monitor_net

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: sv-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitor_net
      - db_net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: sv-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks:
      - monitor_net
      - web_net
