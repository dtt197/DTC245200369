server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Chi lay container cua du an (ten bat dau bang sv-)
      - source_labels: ['__meta_docker_container_name']
        regex: '/sv-.+'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      # Log JSON cua app: tach nhan level (info/error)
      - match:
          selector: '{service="app"}'
          stages:
            - json:
                expressions:
                  level: level
            - labels:
                level:
      # Log JSON cua nginx: tach nhan status (200, 404, 500...)
      - match:
          selector: '{service="nginx"}'
          stages:
            - json:
                expressions:
                  status: status
            - labels:
                status:
