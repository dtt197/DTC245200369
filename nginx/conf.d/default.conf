# ---------- Cong 80: chuyen vinh vien sang HTTPS ----------
server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /dev/stdout main_json;
    return 301 https://$host:8443$request_uri;
}

# ---------- Cong 443: HTTPS + reverse proxy ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    access_log /dev/stdout main_json;
    error_log  /dev/stderr warn;
    client_max_body_size 1m;

    # Khong cho ben ngoai doc /metrics (Prometheus doc truc tiep trong mang Docker)
    location = /metrics {
        return 404;
    }

    # Grafana (websocket cho Grafana Live)
    location /grafana/api/live/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Grafana
    location /grafana/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header X-Frame-Options;
        proxy_pass http://grafana:3000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # phpMyAdmin
    location /phpmyadmin/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header X-Frame-Options;
        proxy_pass http://phpmyadmin:80/;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Ung dung quan ly sinh vien
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_hide_header X-Powered-By;
        proxy_pass http://app:3000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
